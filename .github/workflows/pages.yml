# Builds both websites and publishes them on GitHub Pages:
#   /             → design-system-website
#   /marketplace/ → marketplace-website
name: Publish websites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build design-system website
        working-directory: design-system-website
        run: npm ci && npm run build

      - name: Build marketplace website
        working-directory: marketplace-website
        run: npm ci && npm run build

      - name: Assemble site
        run: |
          mkdir -p site/marketplace
          cp -R design-system-website/out/. site/
          cp -R marketplace-website/out/. site/marketplace/
          # Pages serves full documents: use the dev.html wrapper as each index.html
          mv site/dev.html site/index.html
          mv site/marketplace/dev.html site/marketplace/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
